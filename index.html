<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />

    <!-- PWA & Mobile Meta Tags -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ECTRON PLS" />
    <meta name="theme-color" content="#1a7f37" />
    <meta name="msapplication-TileColor" content="#1a7f37" />

    <!-- SEO -->
    <meta name="description" content="نظام إدارة خط الإنتاج — ECTRON PLS" />
    <meta name="application-name" content="ECTRON PLS" />

    <!-- Icons -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-192.png" />

    <title>ECTRON PLS — نظام إدارة الإنتاج</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Generate PWA icons on first load if missing -->
    <script>
      // Generate PNG icons from canvas for PWA manifest
      function generateIcon(size) {
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        const grad = ctx.createLinearGradient(0, 0, size, size);
        grad.addColorStop(0, '#1a7f37');
        grad.addColorStop(1, '#0550ae');
        ctx.fillStyle = grad;
        const r = size * 0.18;
        ctx.beginPath();
        ctx.moveTo(r, 0); ctx.lineTo(size - r, 0);
        ctx.quadraticCurveTo(size, 0, size, r);
        ctx.lineTo(size, size - r);
        ctx.quadraticCurveTo(size, size, size - r, size);
        ctx.lineTo(r, size);
        ctx.quadraticCurveTo(0, size, 0, size - r);
        ctx.lineTo(0, r);
        ctx.quadraticCurveTo(0, 0, r, 0);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = 'white';
        ctx.font = `bold ${size * 0.55}px Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('⚡', size / 2, size / 2 + size * 0.03);
        return canvas.toDataURL('image/png');
      }
      // Store icons for PWA
      try {
        if (!sessionStorage.getItem('iconsGenerated')) {
          ['192', '512'].forEach(size => {
            const link = document.createElement('link');
            link.rel = 'preload';
            link.as = 'image';
            link.href = generateIcon(parseInt(size));
            document.head.appendChild(link);
          });
          sessionStorage.setItem('iconsGenerated', '1');
        }
      } catch(e) {}
    </script>
  </body>
</html>
